<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumeLens — Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.score-hero{background:linear-gradient(135deg,#161515 0%,#2a1f05 55%,#3d2b00 100%);border-radius:20px;padding:28px 32px;display:flex;align-items:flex-start;gap:28px;flex-wrap:wrap;position:relative;overflow:visible}
.score-hero::before{content:'';position:absolute;inset:0;border-radius:20px;pointer-events:none;background:radial-gradient(ellipse 50% 80% at 88% 50%,rgba(245,154,8,.22) 0%,transparent 70%)}
.ring-wrap{position:relative;flex-shrink:0;width:130px;height:130px}
svg.rsv{display:block}
svg.rsv circle{transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)}
.ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-score{font-size:44px;font-weight:800;letter-spacing:-2px;color:#fff;line-height:1}
.ring-pct{font-size:14px;color:rgba(255,255,255,.5);margin-top:2px}
.hero-text{flex:1;min-width:180px;position:relative;z-index:1}
.hero-text h2{color:#fff;font-size:22px;font-weight:720;letter-spacing:-.4px;line-height:1.25}
.hero-text p{color:rgba(255,255,255,.58);font-size:13px;margin-top:7px;line-height:1.55}
.mini-scores{display:flex;flex-direction:column;gap:12px;flex:1;min-width:180px;position:relative;z-index:1}
.mini-row{display:flex;align-items:center;gap:10px}
.mini-lbl{font-size:12px;color:rgba(255,255,255,.65);width:130px;flex-shrink:0}
.mini-bar{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.mini-fill{height:100%;border-radius:99px;background:var(--amber);width:0;transition:width 1.1s .25s cubic-bezier(.4,0,.2,1)}
.mini-val{font-size:12px;font-weight:640;color:#fff;width:34px;text-align:right}

.rgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media(max-width:900px){.rgrid{grid-template-columns:1fr}}
.rfull{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* missing chip */
.mchip{display:inline-flex;align-items:stretch;border-radius:99px;overflow:hidden;border:1px solid rgba(239,68,68,.3);background:rgba(239,68,68,.07);transition:.2s}
.mchip.done{border-color:rgba(34,197,94,.32);background:rgba(34,197,94,.08)}
.mchip-lbl{padding:5px 10px 5px 13px;font-size:12.5px;font-weight:560;color:#991B1B;line-height:1.2;display:flex;align-items:center;pointer-events:none;transition:color .2s}
.mchip.done .mchip-lbl{color:#166534}
.mchip-btn{padding:0 11px;border:none;cursor:pointer;background:rgba(239,68,68,.22);color:#dc2626;font-size:17px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;transition:.18s;min-width:32px;font-family:inherit}
.mchip-btn:hover{background:rgba(239,68,68,.4)}
.mchip.done .mchip-btn{background:rgba(34,197,94,.2);color:#16a34a;cursor:default;pointer-events:none}

.added-box{display:none;align-items:center;gap:10px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.22);border-radius:10px;padding:10px 16px;font-size:13px;color:#166534;margin-top:12px;line-height:1.5}
.added-box.show{display:flex}

/* job cards */
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:18px}
.jcard{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;gap:10px;transition:.2s}
.jcard:hover{border-color:var(--amber);box-shadow:0 6px 24px rgba(245,154,8,.13)}
.jc-e{font-size:30px;line-height:1}
.jc-t{font-size:15px;font-weight:680;color:var(--ink);letter-spacing:-.2px}
.jc-p{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:660;width:fit-content}
.jc-p.hi{background:rgba(34,197,94,.1);color:#166534}
.jc-p.md{background:rgba(245,154,8,.1);color:#92400e}
.jc-p.lo{background:rgba(0,0,0,.05);color:var(--secondary)}
.jc-co{font-size:12px;color:var(--muted)}
.jc-d{font-size:13px;color:var(--secondary);line-height:1.55;flex:1}
.jc-s{display:flex;flex-wrap:wrap;gap:5px}
.jcs{font-size:11px;font-weight:560;padding:2px 8px;border-radius:99px;background:var(--amber-bg);color:var(--amber-dark);border:1px solid rgba(245,154,8,.18)}

@keyframes popIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
</style>
</head>

<main class="app-main">
  <header class="app-topbar">
    <span class="topbar-title" id="page-title">Analysis Results</span>
    <div class="topbar-right">
      <a href="analyzer.html" class="btn btn-primary btn-sm">New Analysis</a>
      <a href="profile.html" class="avatar-btn" data-user-initial>?</a>
    </div>
  </header>
  <div class="app-content" id="root">
    <div class="empty-state"><div class="spinner dark" style="width:32px;height:32px;border-width:3px"></div><div class="empty-state-text">Loading…</div></div>
  </div>
</main>

<script src="shared.js"></script>
<script>
'use strict';

/* ── auth ── */
const user = Auth.requireAuth();
if (!user) throw new Error('not logged in');
initSidebar();
document.getElementById('logout-btn').addEventListener('click', () => { Auth.logout(); location.href = 'index.html'; });

/* ── load entry ── */
const qid   = new URLSearchParams(location.search).get('id');
const entry = qid ? History.getOne(user.id, qid) : null;

if (!entry || !entry.result) {
  document.getElementById('root').innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-title">Result not found</div><div class="empty-state-text">This analysis was deleted or the link is invalid.</div><a href="analyzer.html" class="btn btn-primary" style="margin-top:8px">New Analysis</a></div>';
} else {
  boot(entry);
}

/* ═══════════════════════════════════════════
   BOOT — called once with the history entry
   ═══════════════════════════════════════════ */
function boot(entry) {
  const r  = entry.result;
  const dt = new Date(entry.date).toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});

  document.getElementById('page-title').textContent = entry.label || 'Analysis Results';

  const SC   = r.finalScore;
  const CIRC = 2 * Math.PI * 54;
  const OFF  = CIRC * (1 - SC / 100);
  const COL  = SC >= 70 ? '#22c55e' : SC >= 45 ? '#f59a08' : '#ef4444';

  /* ── build HTML ── */
  document.getElementById('root').innerHTML =
    (entry.isDemo ? '<div><span class="demo-badge" style="font-size:13px;padding:5px 14px">🧪 Demo Analysis</span></div>' : '') +

    /* score hero */
    `<div class="score-hero">
      <div class="ring-wrap">
        <svg class="rsv" width="130" height="130" viewBox="0 0 130 130">
          <circle cx="65" cy="65" r="54" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="9"/>
          <circle id="arc" cx="65" cy="65" r="54" fill="none" stroke="${COL}" stroke-width="9"
            stroke-linecap="round" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"
            transform="rotate(-90 65 65)"/>
        </svg>
        <div class="ring-inner"><span class="ring-score">${SC}</span><span class="ring-pct">/ 100</span></div>
      </div>
      <div class="hero-text">
        <h2>${h(entry.label || 'Analysis Results')}</h2>
        <p>Analyzed on ${dt} · ATS Score: <strong style="color:#fff">${r.ats.score}%</strong></p>
        <p style="margin-top:10px;font-size:12px">Score = Skill Coverage 45% + Text Similarity 35% + Keyword Presence 20%. Content-alignment estimate only.</p>
      </div>
      <div class="mini-scores">
        ${bar('Skill Coverage',   r.skillCoverage)}
        ${bar('Text Similarity',  r.tfidfScore)}
        ${bar('Keyword Presence', r.keywordScore)}
        ${bar('ATS Friendliness', r.ats.score)}
      </div>
    </div>` +

    /* results grid */
    `<div class="rgrid">

      <!-- MATCHED -->
      <div class="app-card">
        <div class="app-card-title">✅ Matched Skills <span id="mc" style="font-size:13px;font-weight:400;color:var(--secondary)">(${r.matchedSkills.length})</span></div>
        <div class="app-card-sub">In both your resume and the job description. Hit <b style="color:var(--amber-dark)">＋</b> on missing skills below to add ones you have.</div>
        <div class="chips" id="matched">
          ${r.matchedSkills.length
            ? r.matchedSkills.map(s => `<span class="badge badge-green">${h(s)}</span>`).join('')
            : '<span id="nmp" style="font-size:13.5px;color:var(--muted)">No matched skills yet — use ＋ buttons below.</span>'}
        </div>
      </div>

      <!-- MISSING -->
      <div class="app-card">
        <div class="app-card-title">⚠️ Missing Skills <span id="xc" style="font-size:13px;font-weight:400;color:var(--secondary)">(${r.missingSkills.length})</span></div>
        <div class="app-card-sub">Not detected in your resume. Click <b style="color:var(--amber-dark)">＋</b> on any skill you actually have — it moves to Matched instantly.</div>
        ${r.missingTech.length
          ? `<div style="margin-top:14px"><div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Technical</div><div class="chips">${r.missingTech.map((s,i) => chip(s, i, 'T')).join('')}</div></div>`
          : ''}
        ${r.missingSoft.length
          ? `<div style="margin-top:12px"><div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Soft Skills</div><div class="chips">${r.missingSoft.map((s,i) => chip(s, i, 'S')).join('')}</div></div>`
          : ''}
        ${!r.missingSkills.length ? '<p style="font-size:14px;color:var(--secondary);margin-top:12px">🎉 All detected job skills are in your resume!</p>' : ''}
        <div class="added-box" id="abox"><span>✅</span><span id="atxt">Moved.</span></div>
        <p style="font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5">Session-only — doesn't modify your actual resume file.</p>
      </div>

      <!-- KEYWORDS -->
      <div class="app-card">
        <div class="app-card-title">🔑 Keyword Analysis</div>
        <div class="app-card-sub">Top job-description keywords vs your resume</div>
        <div style="margin-top:14px">
          <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px">Found (${r.kpMatched.length})</div>
          <div class="chips">${r.kpMatched.slice(0,18).map(k=>`<span class="badge badge-green">${h(k)}</span>`).join('') || '<span style="color:var(--muted);font-size:13px">None</span>'}</div>
        </div>
        <div style="margin-top:14px">
          <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px">Missing (${r.kpMissing.length})</div>
          <div class="chips">${r.kpMissing.slice(0,18).map(k=>`<span class="badge badge-gray">${h(k)}</span>`).join('') || '<span style="color:var(--muted);font-size:13px">All found!</span>'}</div>
        </div>
        <p style="font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5">Only add keywords that genuinely reflect your experience.</p>
      </div>

      <!-- ATS -->
      <div class="app-card">
        <div class="app-card-title">🤖 ATS Friendliness <span class="badge badge-${r.ats.score>=70?'green':r.ats.score>=50?'amber':'red'}" style="margin-left:8px">${r.ats.score}%</span></div>
        <div class="app-card-sub">${r.ats.passed}/${r.ats.total} structural checks passed</div>
        <div style="margin-top:14px">${r.ats.checks.map(c=>`<div class="ats-item"><div class="ats-icon ${c.pass?'pass':'fail'}">${c.pass?'✓':'✕'}</div><div class="ats-text"><strong>${h(c.label)}</strong><span>${h(c.msg)}</span></div></div>`).join('')}</div>
        <p style="font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5">Heuristic — not a commercial ATS algorithm.</p>
      </div>

      <!-- SUGGESTIONS -->
      <div class="app-card rfull">
        <div class="app-card-title">💡 Improvement Suggestions</div>
        <div class="app-card-sub">Based on gaps between your resume and this job description</div>
        <div style="margin-top:16px">${r.suggestions.map((s,i)=>`<div class="suggestion-item"><div class="suggestion-num">${i+1}</div><div class="suggestion-text"><strong>${h(s.title)}</strong><br>${h(s.text)}</div></div>`).join('')}</div>
      </div>

      <!-- JOB SUGGESTIONS -->
      <div class="app-card rfull">
        <div class="app-card-title">💼 Suggested Job Roles For You</div>
        <div class="app-card-sub">Based on skills detected in your resume — top 6 matches shown</div>
        <div class="jgrid" id="jgrid"></div>
        <p style="font-size:12px;color:var(--muted);margin-top:16px;line-height:1.5">Starting points for exploration. Not a guarantee of employment fit.</p>
      </div>

    </div>

    <!-- actions -->
    <div style="display:flex;flex-wrap:wrap;gap:12px;padding-bottom:16px">
      <a href="analyzer.html" class="btn btn-primary">Analyze Another Job</a>
      <button id="dlbtn" class="btn btn-amber">📄 Download Report</button>
      <a href="resources.html" class="btn btn-outline">📚 Career Resources</a>
      <a href="history.html"   class="btn btn-outline">History</a>
      <a href="dashboard.html" class="btn btn-ghost">← Dashboard</a>
    </div>`;

  /* ── animate ring ── */
  requestAnimationFrame(() => setTimeout(() => {
    const arc = document.getElementById('arc');
    if (arc) arc.style.strokeDashoffset = OFF.toFixed(1);
    document.querySelectorAll('.mini-fill').forEach(el => { el.style.width = el.dataset.v + '%'; });
  }, 150));

  /* ═══════════════════════════════════════
     + BUTTON WIRING
     Key insight: we store skills in a plain
     JS array indexed by data-idx attribute.
     Zero HTML encoding involved.
     ═══════════════════════════════════════ */
  const TECH = r.missingTech.slice(); // copy so it's stable
  const SOFT = r.missingSoft.slice();

  document.querySelectorAll('.mchip-btn').forEach(btn => {
    btn.addEventListener('click', function () {
      const group = this.dataset.group; // 'T' or 'S'
      const idx   = parseInt(this.dataset.idx, 10);
      const skill = group === 'T' ? TECH[idx] : SOFT[idx];
      addSkill(skill, this);
    });
  });

  /* ── job cards ── */
  buildJobs(r);

  /* ── download ── */
  document.getElementById('dlbtn').addEventListener('click', () => downloadReport(entry));
}

/* ═══════════════════════════════════════════
   chip() — uses data-group + data-idx only
   NO skill text in any attribute
   ═══════════════════════════════════════════ */
function chip(skill, idx, group) {
  return `<span class="mchip" id="chip-${group}-${idx}">
    <span class="mchip-lbl">${h(skill)}</span>
    <button class="mchip-btn" data-group="${group}" data-idx="${idx}">＋</button>
  </span>`;
}

/* ═══════════════════════════════════════════
   addSkill() — receives the actual skill
   string directly from the JS array lookup
   ═══════════════════════════════════════════ */
const added = new Set();

function addSkill(skill, btn) {
  if (!skill || added.has(skill)) return;
  added.add(skill);

  /* mark chip done */
  const chip = btn.closest('.mchip');
  chip.classList.add('done');
  btn.textContent = '✓';
  btn.disabled = true;

  /* remove placeholder */
  const nmp = document.getElementById('nmp');
  if (nmp) nmp.remove();

  /* add green badge to matched section */
  const matchedDiv = document.getElementById('matched');
  const badge = document.createElement('span');
  badge.className = 'badge badge-green';
  badge.style.animation = 'popIn .28s ease both';
  badge.textContent = skill;
  matchedDiv.appendChild(badge);

  /* update counters */
  document.getElementById('mc').textContent =
    '(' + matchedDiv.querySelectorAll('.badge.badge-green').length + ')';
  document.getElementById('xc').textContent =
    '(' + document.querySelectorAll('.mchip:not(.done)').length + ')';

  /* notice */
  const box = document.getElementById('abox');
  document.getElementById('atxt').textContent =
    '"' + skill + '" moved to Matched Skills. Add it to your resume if you genuinely have it.';
  box.classList.add('show');

  showToast('"' + skill + '" added to matched skills ✓', 'success', 2500);
}

/* ═══════════════════════════════════════════
   JOB PROFILES — 12 roles, always show 6
   ═══════════════════════════════════════════ */
const JOBS = [
  {e:'💻',t:'Senior Software Engineer',   co:'Google · Meta · Stripe · Shopify',     d:'Design and build scalable systems. Leads technical decisions across the stack.',             s:['Python','JavaScript','TypeScript','React','Node.js','SQL','PostgreSQL','Docker','AWS','Git','REST API','CI/CD']},
  {e:'⚙️', t:'Backend Engineer',           co:'Fintech · SaaS · E-commerce',           d:'Build robust APIs and microservices. Python, Go or Java most in demand.',                  s:['Python','Node.js','Java','Go','SQL','PostgreSQL','MongoDB','REST API','Docker','AWS','Git','Redis']},
  {e:'🎨',t:'Frontend Developer',          co:'Product companies · Agencies',           d:'Create modern, accessible UIs. React + TypeScript the dominant stack.',                    s:['JavaScript','TypeScript','React','Vue','HTML','CSS','Tailwind CSS','Next.js','Git','Figma']},
  {e:'🧩',t:'Full-Stack Engineer',         co:'Startups · Scale-ups',                  d:'Owns end-to-end features across frontend and backend.',                                     s:['JavaScript','TypeScript','React','Node.js','Python','SQL','REST API','Docker','Git','AWS']},
  {e:'☁️', t:'DevOps / Cloud Engineer',    co:'SaaS · Enterprise · Cloud-native',      d:'Automate infra, CI/CD pipelines and keep production running at scale.',                    s:['AWS','Docker','Kubernetes','Terraform','CI/CD','Linux','Git','Shell','Monitoring','Python']},
  {e:'🤖',t:'Machine Learning Engineer',  co:'OpenAI · DeepMind · Big Tech',          d:'Train, optimise and deploy ML models at scale.',                                            s:['Python','Machine Learning','Deep Learning','TensorFlow','PyTorch','Scikit-learn','SQL','AWS','Docker','Kubernetes']},
  {e:'🔬',t:'Data Scientist',             co:'Retail · Finance · Healthcare',          d:'Extract insights and build predictive models. Python, stats and storytelling.',            s:['Python','Statistics','Pandas','NumPy','Scikit-learn','Data Analysis','SQL','Jupyter','A/B Testing']},

function buildJobs(r) {
  const userSkills = new Set([...(r.resumeSkills||[]), ...(r.matchedSkills||[])]);
  const grid = document.getElementById('jgrid');

  const top6 = JOBS
    .map(job => {
      const ov  = job.s.filter(s => userSkills.has(s));
      const pct = Math.round(ov.length / job.s.length * 100);
      return { job, ov, pct };
    })
    .sort((a, b) => b.pct - a.pct)
    .slice(0, 6);

  grid.innerHTML = top6.map(({ job, ov, pct }) => {
    const cls   = pct >= 60 ? 'hi' : pct >= 30 ? 'md' : 'lo';
    const shown = ov.length > 0 ? ov.slice(0, 5) : job.s.slice(0, 4);
    const more  = ov.length > 5 ? `<span class="jcs">+${ov.length - 5}</span>` : '';
    return `<div class="jcard">
      <div class="jc-e">${job.e}</div>
      <div class="jc-t">${h(job.t)}</div>
      <div class="jc-p ${cls}">${pct}% skill match</div>
      <div class="jc-co">📍 ${h(job.co)}</div>
      <div class="jc-d">${h(job.d)}</div>
      <div class="jc-s">${shown.map(s=>`<span class="jcs">${h(s)}</span>`).join('')}${more}</div>
    </div>`;
  }).join('');
}

  <!-- Matched & Missing Skills (two col) -->

  const blob   = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url    = URL.createObjectURL(blob);
  const newTab = window.open(url, '_blank');
  if (!newTab) {
    /* Popup blocked — fall back to direct download link */
    const a    = document.createElement('a');
    a.href     = url;

    /* Revoke after tab has loaded */

/* ── helpers ── */
function bar(label, val) {
  return `<div class="mini-row">
    <span class="mini-lbl">${label}</span>
    <div class="mini-bar"><div class="mini-fill" data-v="${val}"></div></div>
    <span class="mini-val">${val}%</span>
  </div>`;
}
function h(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
